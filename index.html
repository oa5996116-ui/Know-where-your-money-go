<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MERO WEB</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  
  
  <style>
    
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: #0b1120;
    overflow: hidden;
    padding: 20px;
}

/* Glow Background */
body::before {
    content: "";
    position: absolute;
    width: 350px;
    height: 350px;
    background: #00eaff;
    filter: blur(180px);
    opacity: .15;
    z-index: -1;
}

/* Locked Title */
.locked {
    color: #ff3b3b;
    margin-bottom: 20px;
    font-size: 28px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255, 0, 0, .6);
}

/* Main Card */
.card {
    width: 370px;
    background: rgba(17, 24, 39, .95);
    border: 1px solid rgba(0, 234, 255, .2);
    padding: 35px 30px;
    border-radius: 25px;
    box-shadow:
        0 0 25px rgba(0, 234, 255, .15),
        inset 0 0 10px rgba(255, 255, 255, .03);
    backdrop-filter: blur(10px);
    text-align: center;
}

/* Shield Icon */
.icon {
    width: 80px;
    height: 80px;
    margin: auto;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 234, 255, .08);
    border: 2px solid #00eaff;
    margin-bottom: 20px;
}

.icon i {
    color: #00eaff;
    font-size: 35px;
}

/* Title */
.card h1 {
    color: #fff;
    font-size: 26px;
    margin-bottom: 18px;
    text-shadow: 0 0 12px rgba(0, 234, 255, .3);
}

/* Text */
.card p {
    color: #9fb3c8;
    line-height: 1.7;
    font-size: 15px;
}

/* Price */
.price {
    color: #22c55e;
    font-weight: bold;
    font-size: 18px;
}

/* Card Number */
.card-box {
    margin: 25px 0;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, .08);
    padding: 16px;
    border-radius: 15px;
    color: #ff9f43;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    box-shadow: 0 0 15px rgba(255, 153, 0, .1);
}

/* Input */
.input-box {
    position: relative;
    margin-top: 30px;
}

.input-box input {
    width: 100%;
    padding: 14px 0;
    border: none;
    outline: none;
    background: transparent;
    border-bottom: 2px solid #334155;
    color: #fff;
    font-size: 16px;
}

.input-box label {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    pointer-events: none;
    transition: .3s;
}

.input-box span {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 2px;
    background: #00eaff;
    transition: .4s;
}

.input-box input:focus+label,
.input-box input:valid+label {
    top: -8px;
    font-size: 13px;
    color: #00eaff;
}

.input-box input:focus~span {
    width: 100%;
}

/* Button */
button {
    width: 100%;
    margin-top: 30px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #00eaff;
    color: #08111f;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 20px rgba(0, 234, 255, .45);
}

/* Extra Info */
.info {
    margin-top: 10px;
}




    
  </style> 

  <h2 class="locked">
    <i class="fa-solid fa-lock"></i>
    PAGE LOCKED
  </h2>

  <form class="card" onsubmit="event.preventDefault(); unlock();">

    <div class="icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>

    <h1>Welcome In Omar Dashboard</h1>

    <p>
      To unlock the dashboard send
      <span class="price">1$</span>
      to this card
    </p>

    <div class="card-box">
      <i class="fa-regular fa-credit-card"></i>
      5484 - 4608 - 8529 - 6327
    </div>

    <p class="info">
      After payment you will receive a password
      to access the dashboard.
    </p>

    <div class="input-box">

      <input id="password" type="password" required>

      <label>Password</label>

      <span></span>

    </div>
    <br> 
        <p id="msg"></p>
<br> 
    <button onclick="unlock()" type="submit">
      Unlock Dashboard
    </button>

  </form>
  
  
  
  
<script>
  
  function unlock() {
  
  let code = document.getElementById("password").value;
  
  let msg = document.getElementById("msg");
  
  msg.innerText = "";
  
  if (
    code === "67809" ||
    code === "yop23" ||
    code === "tyo46"
  ) {
    
  
    msg.innerText = "The page code is correct ☑";
    msg.style.color = "#35EE1D";
    msg.style.fontWeight = "bold";
    msg.style.fontSize = "18px";
    
    
    
    setTimeout(function(){
    window.location.href = "loading.html";
}, 1000); // 5000 = 5 ثواني

    
}
    
    
  
  else if (code === "") {
    
    msg.innerText = "Enter the code";
    msg.style.color = "#EE1D1D";
    msg.style.fontWeight ="bold"; 
    msg.style.fontSize = "18px"; 
  }
  
  else {
    msg.innerText = "Invalid code";
    msg.style.color = "#EE1D1D";
    msg.style.fontWeight ="bold"; 
    msg.style.fontSize = "18px";
  } 
} 
  
  
</script>




</body>
</html>
